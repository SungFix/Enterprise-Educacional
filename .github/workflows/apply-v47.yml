name: Aplicar correcoes v47

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/v47.part-06'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruir e aplicar patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v47.part-* > /tmp/v47.patch.gz.b64
          echo "a076bb003abefe591a796bb3f2d2fcddb3fc0edaf93f9932c3325537bbb485b1  /tmp/v47.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v47.patch.gz.b64 | gzip -d > /tmp/v47.patch
          echo "81d77c3c30f75feec17ce90354444ca112b620621cd9caf76a23a94596b264be  /tmp/v47.patch" | sha256sum -c -
          git apply --check /tmp/v47.patch
          git apply /tmp/v47.patch

      - name: Validar codigo e integridade
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          node scripts/validate.mjs

      - name: Gerar standalone
        run: python3 scripts/build-standalone.py

      - name: Validar standalone
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Tkinter Web Lite" Enterprise-Educacional.html
          ! grep -q '<script src="app.js' Enterprise-Educacional.html
          ! grep -q 'styles.css?v=' Enterprise-Educacional.html

      - name: Limpar temporarios e publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          rm -f .github/workflows/apply-v47.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix: corrige auditoria geral e restaura Tkinter Web Lite"
          git push origin HEAD:main
