name: Aplicar rebranding Epoch Education v49

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-epoch-v49.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar marca Epoch Education
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          old = 'Enterprise' + ' Educacional'
          new = 'Epoch Education'
          text_ext = {'.html','.js','.css','.json','.webmanifest','.svg','.md','.txt','.sql','.py','.yml','.yaml'}
          special = {'.gitignore','.gitattributes'}
          generated = {'Enterprise-Educacional.html','index-standalone-preview.html'}

          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for rel in tracked:
              if not rel or rel in generated:
                  continue
              p = root / rel
              if not p.is_file() or (p.suffix.lower() not in text_ext and p.name not in special):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')

          for rel in ['index.html','app.js','platform-features.js','service-worker.js']:
              p = root / rel
              text = p.read_text(encoding='utf-8').replace('?v=48','?v=49')
              if rel == 'platform-features.js':
                  text = text.replace('platform features v48','platform features v49')
                  text = text.replace('appVersion:48','appVersion:49')
                  text = text.replace('app_version:48','app_version:49')
              if rel == 'service-worker.js':
                  text = text.replace("'enterprise-educacional-shell-v48'", "'epoch-education-shell-v49'")
                  text = text.replace("'enterprise-educacional-runtime-v48'", "'epoch-education-runtime-v49'")
              p.write_text(text, encoding='utf-8')

          manifest = root / 'manifest.webmanifest'
          text = manifest.read_text(encoding='utf-8').replace('"short_name": "Enterprise"','"short_name": "Epoch"')
          manifest.write_text(text, encoding='utf-8')

          app = root / 'app.js'
          text = app.read_text(encoding='utf-8').replace('`enterprise-educacional-backup-${date}.json`','`epoch-education-backup-${date}.json`')
          app.write_text(text, encoding='utf-8')

          build = root / 'scripts' / 'build-standalone.py'
          text = build.read_text(encoding='utf-8').replace('data-build="48"','data-build="49"')
          build.write_text(text, encoding='utf-8')

          validate = root / 'scripts' / 'validate.mjs'
          text = validate.read_text(encoding='utf-8')
          text = text.replace('version < 48','version < 49')
          text = text.replace('appVersion\\s*:\\s*48','appVersion\\s*:\\s*49')
          text = text.replace('Versão de backup não atualizada para v48','Versão de backup não atualizada para v49')
          brand_check = """
          const legacyBrand = 'Enterprise' + ' Educacional';
          for (const file of ['index.html','app.js','platform-features.js','content-data.js','manifest.webmanifest','assets/branding/enterprise-logo-horizontal.svg','assets/branding/enterprise-symbol.svg']) {
            if (read(file).includes(legacyBrand)) fail(`Marca antiga ainda presente em ${file}`);
          }
          if (manifest.name !== 'Epoch Education' || manifest.short_name !== 'Epoch') fail('Manifest PWA não usa Epoch Education/Epoch');
          else ok('Marca Epoch Education verificada nos arquivos públicos');
          """
          marker = "if (process.exitCode) process.exit(process.exitCode);"
          if brand_check.strip() not in text:
              text = text.replace(marker, brand_check + '\n' + marker)
          validate.write_text(text, encoding='utf-8')

          feedback_schema = root / 'supabase' / 'feedback-schema.sql'
          if feedback_schema.exists():
              text = feedback_schema.read_text(encoding='utf-8').replace('default 48 check (app_version','default 49 check (app_version')
              feedback_schema.write_text(text, encoding='utf-8')

          versions = root / 'versions' / 'VERSOES.md'
          if versions.exists():
              text = versions.read_text(encoding='utf-8').replace('histórico completo v1 a v48','histórico completo v1 a v49')
              line = '- **v49 — RELEASE** — Alteração completa da identidade textual para Epoch Education, preservando EE + </>, dados, funcionalidades, compatibilidade de armazenamento, PWA e standalone.'
              if line not in text:
                  text = text.rstrip() + '\n' + line + '\n'
              versions.write_text(text, encoding='utf-8')

          leftovers = []
          for rel in tracked:
              if not rel or rel in generated:
                  continue
              p = root / rel
              if not p.is_file() or (p.suffix.lower() not in text_ext and p.name not in special):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  leftovers.append(rel)
          if leftovers:
              raise SystemExit('Marca antiga restante: ' + ', '.join(leftovers))
          PY

      - name: Validar código
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          node --check scripts/validate.mjs
          node scripts/validate.mjs

      - name: Gerar standalone v49
        run: python3 scripts/build-standalone.py

      - name: Validar standalone e marca
        shell: bash
        run: |
          cmp -s Enterprise-Educacional.html index-standalone-preview.html
          grep -q 'data-build="49"' Enterprise-Educacional.html
          grep -q 'Epoch Education' Enterprise-Educacional.html
          if grep -q 'Enterprise Educacional' Enterprise-Educacional.html; then exit 1; fi

      - name: Commit final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-epoch-v49.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: altera marca para Epoch Education v49"
          git push origin HEAD:main
