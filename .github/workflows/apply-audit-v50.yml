name: Aplicar correções da auditoria v50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-audit-v50.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correções v50
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, text):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          for rel in ['index.html','app.js','platform-features.js','service-worker.js']:
              write(rel, read(rel).replace('?v=49','?v=50'))

          app = read('app.js')
          old = """async function runResultFullscreen() {
            const target = activeLang === 'python' ? $('#consolePanel') : $('#previewStage');
            if (!target) return;
            if (activeLang === 'python') setConsoleCollapsed(false);
            target.classList.add('result-only-target');
            runPlayground();
            showResultFullscreenHint(target);
          """
          new = """async function runResultFullscreen() {
            const pythonTkinter = activeLang === 'python' && pythonUsesTkinter($('#codeEditor')?.value || pg.python || '');
            const target = activeLang === 'python' ? (pythonTkinter ? $('#previewStage') : $('#consolePanel')) : $('#previewStage');
            if (!target) return;
            if (activeLang === 'python' && !pythonTkinter) setConsoleCollapsed(false);
            target.classList.add('result-only-target');
            runPlayground();
            showResultFullscreenHint(target);
          """
          if old not in app: raise SystemExit('fullscreen target not found')
          write('app.js', app.replace(old,new,1))

          css = read('styles.css')
          marker = '  --editor-split: 55%;\n'
          addition = marker + '  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;\n  --mono: var(--font-mono);\n'
          if '--font-mono:' not in css:
              if marker not in css: raise SystemExit('css variable marker not found')
              css = css.replace(marker, addition, 1)
          write('styles.css', css)

          platform = read('platform-features.js')
          platform = platform.replace('platform features v49','platform features v50',1)
          platform = platform.replace('appVersion:49','appVersion:50',1)
          url_marker = "const EE_FEEDBACK_PROJECT_URL = 'https://xqlbuatjounkpovwggdj.supabase.co';\n"
          if 'EE_FEEDBACK_ENDPOINT' not in platform:
              if url_marker not in platform: raise SystemExit('feedback project url not found')
              platform = platform.replace(url_marker, url_marker + "const EE_FEEDBACK_ENDPOINT = `${EE_FEEDBACK_PROJECT_URL}/functions/v1/submit-feedback`;\n", 1)
          old_fetch = """    const response = await fetch(`${EE_FEEDBACK_PROJECT_URL}/rest/v1/ee_feedback`, {
                method:'POST',
                headers:{ 'apikey':EE_FEEDBACK_PUBLIC_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
                body:JSON.stringify({ category, rating, message, page:String(location.hash || '#home').slice(0,200), app_version:49 })
              });
              if (!response.ok) {
                const detail = await response.text().catch(() => '');
                throw new Error(detail || `Erro HTTP ${response.status}`);
              }
          """
          new_fetch = """    const response = await fetch(EE_FEEDBACK_ENDPOINT, {
                method:'POST',
                headers:{ 'apikey':EE_FEEDBACK_PUBLIC_KEY, 'Content-Type':'application/json' },
                body:JSON.stringify({ category, rating, message, page:String(location.hash || '#home').slice(0,200), website:honeypot })
              });
              if (response.status === 429) {
                eeSetFeedbackStatus('Limite de envios atingido. Aguarde alguns minutos e tente novamente.', 'warning');
                return;
              }
              if (!response.ok) {
                const detail = await response.text().catch(() => '');
                throw new Error(detail || `Erro HTTP ${response.status}`);
              }
          """
          if old_fetch not in platform: raise SystemExit('feedback fetch block not found')
          write('platform-features.js', platform.replace(old_fetch,new_fetch,1))

          write('service-worker.js', read('service-worker.js').replace('epoch-education-shell-v49','epoch-education-shell-v50').replace('epoch-education-runtime-v49','epoch-education-runtime-v50'))

          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          text_ext = {'.html','.js','.css','.json','.webmanifest','.svg','.md','.txt','.sql','.py','.yml','.yaml','.toml'}
          for rel in tracked:
              if not rel or rel == '.github/workflows/apply-audit-v50.yml': continue
              p = root / rel
              if not p.is_file() or p.suffix.lower() not in text_ext: continue
              try: text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              updated = text.replace('SungFix/Enterprise-Educacional','SungFix/EpochEducation').replace('sungfix.github.io/Enterprise-Educacional','sungfix.github.io/EpochEducation')
              if updated != text: p.write_text(updated,encoding='utf-8')

          feedback_schema = r'''-- Epoch Education — banco dedicado de feedbacks v50
          -- O navegador não recebe SELECT/INSERT direto. Envios passam pela Edge Function submit-feedback.

          create table if not exists public.ee_feedback (
            id uuid primary key default gen_random_uuid(),
            category text not null default 'geral' check (category in ('geral','conteudo','playground','bug','visual','sugestao')),
            rating smallint check (rating between 1 and 5),
            message text not null check (char_length(trim(message)) between 5 and 2000),
            page text not null default '' check (char_length(page) <= 200),
            app_version integer not null default 50 check (app_version between 1 and 9999),
            created_at timestamptz not null default now()
          );
          alter table public.ee_feedback alter column app_version set default 50;
          alter table public.ee_feedback enable row level security;
          revoke all on table public.ee_feedback from anon, authenticated;
          revoke insert (category, rating, message, page, app_version) on table public.ee_feedback from anon, authenticated;
          drop policy if exists ee_feedback_insert_public on public.ee_feedback;
          drop policy if exists ee_feedback_deny_public on public.ee_feedback;
          create policy ee_feedback_deny_public on public.ee_feedback for all to anon, authenticated using (false) with check (false);
          create index if not exists ee_feedback_created_at_idx on public.ee_feedback (created_at desc);

          create table if not exists public.ee_feedback_rate_limits (
            key_hash text primary key check (char_length(key_hash) = 64),
            window_start timestamptz not null default now(),
            request_count integer not null default 1 check (request_count >= 0),
            last_seen timestamptz not null default now()
          );
          alter table public.ee_feedback_rate_limits enable row level security;
          revoke all on table public.ee_feedback_rate_limits from anon, authenticated;
          drop policy if exists ee_feedback_rate_limits_deny_public on public.ee_feedback_rate_limits;
          create policy ee_feedback_rate_limits_deny_public on public.ee_feedback_rate_limits for all to anon, authenticated using (false) with check (false);

          create or replace function public.ee_feedback_consume_rate_limit(p_key_hash text, p_limit integer default 3, p_window_seconds integer default 600)
          returns boolean language plpgsql security definer set search_path = pg_catalog, public as $$
          declare v_allowed boolean := false; v_now timestamptz := clock_timestamp();
          begin
            if p_key_hash is null or char_length(p_key_hash) <> 64 or p_limit < 1 or p_window_seconds < 30 then return false; end if;
            insert into public.ee_feedback_rate_limits as rl (key_hash, window_start, request_count, last_seen)
            values (p_key_hash, v_now, 1, v_now)
            on conflict (key_hash) do update set
              window_start = case when rl.window_start <= v_now - make_interval(secs => p_window_seconds) then v_now else rl.window_start end,
              request_count = case when rl.window_start <= v_now - make_interval(secs => p_window_seconds) then 1 else rl.request_count + 1 end,
              last_seen = v_now
            returning request_count <= p_limit into v_allowed;
            return coalesce(v_allowed, false);
          end;
          $$;
          revoke all on function public.ee_feedback_consume_rate_limit(text, integer, integer) from public, anon, authenticated;
          grant execute on function public.ee_feedback_consume_rate_limit(text, integer, integer) to service_role;
          comment on table public.ee_feedback is 'Feedbacks anonimos enviados pelo site Epoch Education.';
          comment on table public.ee_feedback_rate_limits is 'Rate limit interno do endpoint de feedback do Epoch Education.';
          '''
          write('supabase/feedback-schema.sql', feedback_schema)

          migration1 = r'''alter table public.ee_feedback alter column app_version set default 50;
          revoke insert on table public.ee_feedback from anon, authenticated;
          revoke insert (category, rating, message, page, app_version) on table public.ee_feedback from anon, authenticated;
          drop policy if exists ee_feedback_insert_public on public.ee_feedback;
          create table if not exists public.ee_feedback_rate_limits (key_hash text primary key check (char_length(key_hash)=64), window_start timestamptz not null default now(), request_count integer not null default 1 check (request_count>=0), last_seen timestamptz not null default now());
          alter table public.ee_feedback_rate_limits enable row level security;
          revoke all on table public.ee_feedback_rate_limits from anon, authenticated;
          create or replace function public.ee_feedback_consume_rate_limit(p_key_hash text,p_limit integer default 3,p_window_seconds integer default 600) returns boolean language plpgsql security definer set search_path=pg_catalog,public as $$ declare v_allowed boolean:=false; v_now timestamptz:=clock_timestamp(); begin if p_key_hash is null or char_length(p_key_hash)<>64 or p_limit<1 or p_window_seconds<30 then return false; end if; insert into public.ee_feedback_rate_limits as rl(key_hash,window_start,request_count,last_seen) values(p_key_hash,v_now,1,v_now) on conflict(key_hash) do update set window_start=case when rl.window_start<=v_now-make_interval(secs=>p_window_seconds) then v_now else rl.window_start end, request_count=case when rl.window_start<=v_now-make_interval(secs=>p_window_seconds) then 1 else rl.request_count+1 end,last_seen=v_now returning request_count<=p_limit into v_allowed; return coalesce(v_allowed,false); end; $$;
          revoke all on function public.ee_feedback_consume_rate_limit(text,integer,integer) from public,anon,authenticated;
          grant execute on function public.ee_feedback_consume_rate_limit(text,integer,integer) to service_role;
          '''
          migration2 = r'''drop policy if exists ee_feedback_deny_public on public.ee_feedback;
          create policy ee_feedback_deny_public on public.ee_feedback for all to anon,authenticated using(false) with check(false);
          drop policy if exists ee_feedback_rate_limits_deny_public on public.ee_feedback_rate_limits;
          create policy ee_feedback_rate_limits_deny_public on public.ee_feedback_rate_limits for all to anon,authenticated using(false) with check(false);
          '''
          write('supabase/migrations/20260830165508_secure_feedback_edge_rate_limit_v50.sql', migration1)
          write('supabase/migrations/20260830170056_explicit_deny_feedback_public_access_v50.sql', migration2)

          edge = r'''import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          const SUPABASE_URL = Deno.env.get("SUPABASE_URL") ?? "";
          const PUBLISHABLE_KEYS = JSON.parse(Deno.env.get("SUPABASE_PUBLISHABLE_KEYS") ?? "{}");
          const SECRET_KEYS = JSON.parse(Deno.env.get("SUPABASE_SECRET_KEYS") ?? "{}");
          const PUBLIC_KEY = String(PUBLISHABLE_KEYS.default ?? "");
          const SECRET_KEY = String(SECRET_KEYS.default ?? "");
          const ALLOWED_ORIGINS = new Set(["https://sungfix.github.io", "http://localhost", "http://127.0.0.1", "null"]);
          const CATEGORIES = new Set(["geral", "conteudo", "playground", "bug", "visual", "sugestao"]);
          function cors(origin: string) { return { "Access-Control-Allow-Origin":origin, "Access-Control-Allow-Headers":"apikey, content-type", "Access-Control-Allow-Methods":"POST, OPTIONS", "Vary":"Origin" }; }
          function json(status:number, body:Record<string,unknown>, origin:string, extra:Record<string,string>={}) { return new Response(JSON.stringify(body),{status,headers:{...cors(origin),"Content-Type":"application/json; charset=utf-8",...extra}}); }
          async function sha256(input:string) { const data=new TextEncoder().encode(input); const digest=await crypto.subtle.digest("SHA-256",data); return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
          async function adminRpc(path:string, body:unknown) { return fetch(`${SUPABASE_URL}${path}`,{method:"POST",headers:{apikey:SECRET_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}); }
          async function adminInsert(path:string, body:unknown) { return fetch(`${SUPABASE_URL}${path}`,{method:"POST",headers:{apikey:SECRET_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)}); }
          Deno.serve(async(req:Request)=>{
            const origin=req.headers.get("origin")??""; const responseOrigin=ALLOWED_ORIGINS.has(origin)?origin:"https://sungfix.github.io";
            if(req.method==="OPTIONS"){ if(!ALLOWED_ORIGINS.has(origin)) return json(403,{error:"origin_not_allowed"},responseOrigin); return new Response(null,{status:204,headers:cors(origin)}); }
            if(req.method!=="POST") return json(405,{error:"method_not_allowed"},responseOrigin);
            if(!ALLOWED_ORIGINS.has(origin)) return json(403,{error:"origin_not_allowed"},responseOrigin);
            if(!PUBLIC_KEY||!SECRET_KEY||!SUPABASE_URL) return json(503,{error:"service_unavailable"},origin);
            if((req.headers.get("apikey")??"")!==PUBLIC_KEY) return json(401,{error:"invalid_api_key"},origin);
            if(Number(req.headers.get("content-length")||0)>8192) return json(413,{error:"payload_too_large"},origin);
            let payload:Record<string,unknown>; try{payload=await req.json();}catch{return json(400,{error:"invalid_json"},origin);}
            if(String(payload.website??"").trim()) return json(204,{},origin);
            const category=String(payload.category??"geral"), message=String(payload.message??"").trim(), page=String(payload.page??"#home").slice(0,200);
            const raw=payload.rating===null||payload.rating===""||payload.rating===undefined?null:Number(payload.rating); const rating=raw===null?null:raw;
            if(!CATEGORIES.has(category)) return json(400,{error:"invalid_category"},origin);
            if(message.length<5||message.length>2000) return json(400,{error:"invalid_message"},origin);
            if(rating!==null&&(!Number.isInteger(rating)||rating<1||rating>5)) return json(400,{error:"invalid_rating"},origin);
            const forwarded=req.headers.get("x-forwarded-for")?.split(",")[0]?.trim(); const clientIp=req.headers.get("cf-connecting-ip")||forwarded||req.headers.get("x-real-ip")||"unknown"; const userAgent=(req.headers.get("user-agent")??"unknown").slice(0,180); const keyHash=await sha256(`${SECRET_KEY}|${clientIp}|${userAgent}`);
            const rateResponse=await adminRpc("/rest/v1/rpc/ee_feedback_consume_rate_limit",{p_key_hash:keyHash,p_limit:3,p_window_seconds:600});
            if(!rateResponse.ok){console.error("feedback_rate_limit_failed",rateResponse.status,await rateResponse.text().catch(()=>""));return json(503,{error:"service_unavailable"},origin);}
            let allowed=false; try{allowed=(await rateResponse.json())===true;}catch{allowed=false;} if(!allowed) return json(429,{error:"rate_limited"},origin,{"Retry-After":"600"});
            const insertResponse=await adminInsert("/rest/v1/ee_feedback",{category,rating,message,page,app_version:50});
            if(!insertResponse.ok){console.error("feedback_insert_failed",insertResponse.status,await insertResponse.text().catch(()=>""));return json(503,{error:"service_unavailable"},origin);}
            return json(200,{ok:true},origin);
          });
          '''
          write('supabase/functions/submit-feedback/index.ts', edge)

          write('scripts/build-standalone.py', read('scripts/build-standalone.py').replace('data-build="49"','data-build="50"'))
          validate = read('scripts/validate.mjs')
          validate = validate.replace('version < 49','version < 50').replace('appVersion\\s*:\\s*49','appVersion\\s*:\\s*50').replace('Versão de backup não atualizada para v49','Versão de backup não atualizada para v50')
          old_feedback_check = "if (!platformSource.includes('EE_FEEDBACK_PROJECT_URL') || !platformSource.includes('sb_publishable_') || !platformSource.includes('/rest/v1/ee_feedback')) fail('Integração pública de feedback incompleta');"
          new_feedback_check = "if (!platformSource.includes('EE_FEEDBACK_ENDPOINT') || !platformSource.includes('sb_publishable_') || !platformSource.includes('/functions/v1/submit-feedback')) fail('Integração segura de feedback incompleta');\nelse if (platformSource.includes('/rest/v1/ee_feedback')) fail('Frontend ainda possui inserção direta na tabela de feedback');"
          if old_feedback_check not in validate: raise SystemExit('validator feedback check not found')
          validate = validate.replace(old_feedback_check,new_feedback_check,1)
          old_schema_check = "if (!feedbackSchemaSource.includes('enable row level security') || !feedbackSchemaSource.includes('grant insert') || !feedbackSchemaSource.includes('revoke all')) fail('Schema de feedback sem proteção RLS/grants mínimos');\nelse ok('Schema de feedback protegido por RLS e privilégio mínimo');"
          new_schema_check = "if (!feedbackSchemaSource.includes('enable row level security') || !feedbackSchemaSource.includes('revoke insert') || !feedbackSchemaSource.includes('ee_feedback_rate_limits') || !feedbackSchemaSource.includes('grant execute') || !feedbackSchemaSource.includes('service_role')) fail('Schema de feedback v50 sem RLS/rate limit/privilégio mínimo');\nelse ok('Schema de feedback v50 protegido por RLS, Edge Function e rate limit');"
          if old_schema_check not in validate: raise SystemExit('validator schema check not found')
          validate = validate.replace(old_schema_check,new_schema_check,1)
          extra = """
          if (!css.includes('--font-mono:') || !css.includes('--mono: var(--font-mono)')) fail('Variáveis de fonte monoespaçada ausentes');
          else ok('Variáveis de fonte monoespaçada definidas');
          if (!appSource.includes("pythonTkinter ? $('#previewStage') : $('#consolePanel')")) fail('Tela cheia do Tkinter ainda aponta para o Console');
          else ok('Tela cheia do Tkinter usa o resultado visual');
          const feedbackFunctionPath = path.join(root,'supabase/functions/submit-feedback/index.ts');
          const feedbackFunctionSource = fs.existsSync(feedbackFunctionPath) ? read('supabase/functions/submit-feedback/index.ts') : '';
          if (!feedbackFunctionSource.includes('p_limit:3') || !feedbackFunctionSource.includes('p_window_seconds:600') || !feedbackFunctionSource.includes('SUPABASE_SECRET_KEYS')) fail('Edge Function de feedback sem rate limit/segredo de backend');
          else ok('Edge Function de feedback com validação e rate limit');
          """
          brand_marker = "const legacyBrand = 'Enterprise' + ' Educacional';"
          if extra.strip() not in validate:
              if brand_marker not in validate: raise SystemExit('validator brand marker not found')
              validate = validate.replace(brand_marker, extra + '\n' + brand_marker, 1)
          write('scripts/validate.mjs', validate)

          versions = read('versions/VERSOES.md').replace('histórico completo v1 a v49','histórico completo v1 a v50')
          line = '- **v50 — RELEASE** — Correções da auditoria: fullscreen visual do Tkinter, fontes monoespaçadas, feedback via Edge Function com rate limit e bloqueio de INSERT público, Supabase v50 e republicação após renome do repositório.'
          if line not in versions: versions = versions.rstrip() + '\n' + line + '\n'
          write('versions/VERSOES.md', versions)
          PY

      - name: Validar código e regressões
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          node --check scripts/validate.mjs
          node scripts/validate.mjs
          git diff --check

      - name: Gerar standalone v50
        run: python3 scripts/build-standalone.py

      - name: Validar standalone e publicação
        shell: bash
        run: |
          cmp -s Enterprise-Educacional.html index-standalone-preview.html
          grep -q 'data-build="50"' Enterprise-Educacional.html
          grep -q 'Epoch Education' Enterprise-Educacional.html
          grep -q '/functions/v1/submit-feedback' Enterprise-Educacional.html
          if grep -q '/rest/v1/ee_feedback' platform-features.js; then exit 1; fi
          if grep -R -q 'SungFix/Enterprise-Educacional' --exclude='apply-audit-v50.yml' .; then exit 1; fi
          if grep -R -q 'sungfix.github.io/Enterprise-Educacional' --exclude='apply-audit-v50.yml' .; then exit 1; fi

      - name: Commit final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-audit-v50.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: corrige auditoria geral v50"
          git push origin HEAD:main
