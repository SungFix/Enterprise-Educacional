name: Aplicar nome correto do standalone v51

on:
  push:
    paths:
      - '.github/workflows/apply-standalone-name-v51.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar nome e versão v51
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old_name = 'Enterprise-Educacional.html'
          new_name = 'Epoch-Education.html'

          # Corrige referências exatas ao antigo nome do standalone em arquivos textuais.
          suffixes = {'.md','.py','.mjs','.yml','.yaml','.js','.html','.sql','.txt','.webmanifest','.css','.svg'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old_name in text:
                  path.write_text(text.replace(old_name, new_name), encoding='utf-8')

          # Public assets/cache version.
          for filename in ['index.html','app.js','platform-features.js','bootstrap.js','service-worker.js']:
              path = root / filename
              text = path.read_text(encoding='utf-8')
              text = text.replace('?v=50', '?v=51')
              if filename == 'service-worker.js':
                  text = text.replace('v50', 'v51')
              if filename == 'platform-features.js':
                  text = text.replace('features v50', 'features v51')
                  text = text.replace('appVersion:50', 'appVersion:51')
                  text = re.sub(r'(EE_FEEDBACK_APP_VERSION\s*=\s*)50\b', r'\g<1>51', text)
              path.write_text(text, encoding='utf-8')

          # Build standalone.
          build = root / 'scripts/build-standalone.py'
          text = build.read_text(encoding='utf-8')
          text = text.replace('data-build="50"', 'data-build="51"')
          text = text.replace("root / 'Enterprise-Educacional.html'", "root / 'Epoch-Education.html'")
          build.write_text(text, encoding='utf-8')

          # Validator: v51 + nome correto obrigatório.
          validate = root / 'scripts/validate.mjs'
          text = validate.read_text(encoding='utf-8')
          text = text.replace('version < 50', 'version < 51')
          text = text.replace('appVersion\\s*:\\s*50', 'appVersion\\s*:\\s*51')
          text = text.replace('v50', 'v51')
          marker = "if (process.exitCode) process.exit(process.exitCode);"
          checks = """
if (!fs.existsSync(path.join(root,'Epoch-Education.html'))) fail('Standalone Epoch-Education.html ausente');
if (fs.existsSync(path.join(root,'Enterprise-Educacional.html'))) fail('Standalone antigo Enterprise-Educacional.html ainda existe');
if (!read('scripts/build-standalone.py').includes("root / 'Epoch-Education.html'")) fail('Build ainda não gera Epoch-Education.html');
else ok('Nome do standalone Epoch-Education.html verificado');

"""
          if 'Nome do standalone Epoch-Education.html verificado' not in text:
              text = text.replace(marker, checks + marker)
          validate.write_text(text, encoding='utf-8')

          # Schema version default acompanha o app.
          schema = root / 'supabase/feedback-schema.sql'
          if schema.exists():
              text = schema.read_text(encoding='utf-8')
              text = re.sub(r'(app_version integer not null default )50\b', r'\g<1>51', text)
              schema.write_text(text, encoding='utf-8')

          # Histórico v51.
          versions = root / 'versions/VERSOES.md'
          text = versions.read_text(encoding='utf-8')
          text = text.replace('histórico completo v1 a v50', 'histórico completo v1 a v51')
          if '**v51 — RELEASE**' not in text:
              text = text.rstrip() + "\n- **v51 — RELEASE** — Standalone renomeado para Epoch-Education.html; build, validação e referências atualizados para usar exclusivamente o nome correto da marca.\n"
          versions.write_text(text, encoding='utf-8')

          # O arquivo antigo não deve sobreviver ao novo build.
          old = root / old_name
          if old.exists(): old.unlink()
          PY

      - name: Gerar e validar standalone
        shell: bash
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          python scripts/build-standalone.py
          node scripts/validate.mjs
          test -f Epoch-Education.html
          test ! -e Enterprise-Educacional.html
          cmp -s Epoch-Education.html index-standalone-preview.html
          if grep -RIl --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.zip' 'Enterprise-Educacional.html' . | grep -q .; then
            echo 'ERRO: referência ao nome antigo encontrada'
            grep -RIl --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.zip' 'Enterprise-Educacional.html' .
            exit 1
          fi

      - name: Commit final v51
        shell: bash
        run: |
          git config user.name 'Sung_Fix'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-standalone-name-v51.yml
          git add -A
          git commit -m 'fix: renomeia standalone para Epoch Education v51'
          git push origin main
