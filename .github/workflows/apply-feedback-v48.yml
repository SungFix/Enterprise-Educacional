name: Aplicar feedback v48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-feedback-v48.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar integração de feedbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          index_path = root / 'index.html'
          platform_path = root / 'platform-features.js'
          styles_path = root / 'styles.css'
          sw_path = root / 'service-worker.js'
          app_path = root / 'app.js'
          build_path = root / 'scripts' / 'build-standalone.py'
          validate_path = root / 'scripts' / 'validate.mjs'

          index = index_path.read_text(encoding='utf-8')
          platform = platform_path.read_text(encoding='utf-8')
          styles = styles_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          build = build_path.read_text(encoding='utf-8')
          validate = validate_path.read_text(encoding='utf-8')

          index = index.replace('?v=47', '?v=48')
          app = app.replace('?v=47', '?v=48')
          platform = platform.replace('?v=47', '?v=48')
          sw = sw.replace('v47', 'v48').replace('?v=47', '?v=48')
          build = build.replace('data-build="47"', 'data-build="48"')

          old_footer = '<div><h2>Ferramentas</h2><a href="#playground">Playground</a><a href="#glossario">Glossário</a><a href="#progresso">Progresso</a></div>'
          new_footer = '<div><h2>Ferramentas</h2><a href="#playground">Playground</a><a href="#glossario">Glossário</a><a href="#progresso">Progresso</a><button class="footer-link-button" id="openFeedback" type="button">Enviar feedback</button></div>'
          if old_footer not in index:
              raise SystemExit('footer target not found')
          index = index.replace(old_footer, new_footer, 1)

          marker = '  <dialog class="saved-code-dialog project-verifier-dialog" id="projectVerifierDialog" aria-labelledby="projectVerifierTitle">'
          feedback_html = '''  <dialog class="saved-code-dialog feedback-dialog" id="feedbackDialog" aria-labelledby="feedbackDialogTitle">
            <form class="saved-code-modal feedback-modal" id="feedbackForm">
              <div class="saved-code-dialog-head"><div><span class="detail-kicker">Ajude a melhorar</span><strong id="feedbackDialogTitle">Enviar feedback</strong><p>Conte o que funcionou bem, o que pode melhorar ou relate um problema.</p></div><button class="icon-button" id="closeFeedback" type="button" aria-label="Fechar feedback"><svg class="ui-icon"><use href="#icon-close"></use></svg></button></div>
              <div class="saved-code-dialog-body feedback-body">
                <div class="feedback-field-grid">
                  <label><span>Tipo</span><select id="feedbackCategory" required><option value="geral">Geral</option><option value="conteudo">Conteúdo educacional</option><option value="playground">Playground / Python</option><option value="bug">Erro ou bug</option><option value="visual">Visual / responsividade</option><option value="sugestao">Sugestão</option></select></label>
                  <label><span>Avaliação</span><select id="feedbackRating"><option value="">Sem nota</option><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Pode melhorar</option><option value="1">1 — Ruim</option></select></label>
                </div>
                <label class="feedback-message-field"><span>Seu feedback</span><textarea id="feedbackText" minlength="5" maxlength="2000" required placeholder="Escreva aqui sua experiência, sugestão ou problema..."></textarea><small><span id="feedbackCounter">0</span>/2000 caracteres</small></label>
                <label class="feedback-honeypot" aria-hidden="true"><span>Website</span><input id="feedbackWebsite" type="text" tabindex="-1" autocomplete="off"></label>
                <p class="cloud-help">O feedback é enviado sem nome ou e-mail. Não inclua senhas, documentos ou outros dados pessoais.</p>
                <p class="saved-code-validation" id="feedbackStatus" hidden></p>
              </div>
              <div class="saved-code-dialog-actions feedback-actions"><span></span><span></span><button class="button secondary" id="cancelFeedback" type="button">Cancelar</button><button class="button primary" id="submitFeedback" type="submit">Enviar feedback</button></div>
            </form>
          </dialog>

          '''
          if marker not in index:
              raise SystemExit('dialog marker not found')
          index = index.replace(marker, feedback_html + marker, 1)

          platform = platform.replace('/* Enterprise Educacional — platform features v47', '/* Enterprise Educacional — platform features v48', 1)
          platform = platform.replace('appVersion:47', 'appVersion:48', 1)

          feedback_js = r'''const EE_FEEDBACK_PROJECT_URL = 'https://xqlbuatjounkpovwggdj.supabase.co';
          const EE_FEEDBACK_PUBLIC_KEY = 'sb_publishable_03cXMvbU2fQEqkZ-Z7xI_g_Ji97Txy_';
          const EE_FEEDBACK_COOLDOWN_KEY = 'enterprise-educacional-feedback-last-v1';

          function eeSetFeedbackStatus(message = '', kind = '') {
            const node = $('#feedbackStatus');
            if (!node) return;
            node.hidden = !message;
            node.textContent = message;
            node.dataset.kind = kind;
          }
          function eeUpdateFeedbackCounter() {
            const text = $('#feedbackText')?.value || '';
            const counter = $('#feedbackCounter');
            if (counter) counter.textContent = String(text.length);
          }
          function openFeedbackDialog() {
            const dialog = $('#feedbackDialog');
            const form = $('#feedbackForm');
            if (!dialog || !form) return;
            form.reset();
            eeSetFeedbackStatus('');
            eeUpdateFeedbackCounter();
            if (!dialog.open) dialog.showModal();
            setTimeout(() => $('#feedbackText')?.focus(), 60);
          }
          async function eeSubmitFeedback(event) {
            event.preventDefault();
            const form = $('#feedbackForm');
            const button = $('#submitFeedback');
            const message = String($('#feedbackText')?.value || '').trim();
            const category = String($('#feedbackCategory')?.value || 'geral');
            const ratingRaw = String($('#feedbackRating')?.value || '');
            const honeypot = String($('#feedbackWebsite')?.value || '').trim();
            const categories = new Set(['geral','conteudo','playground','bug','visual','sugestao']);
            if (honeypot) { form?.reset(); $('#feedbackDialog')?.close(); return; }
            if (!categories.has(category)) { eeSetFeedbackStatus('Escolha um tipo de feedback válido.', 'error'); return; }
            if (message.length < 5 || message.length > 2000) { eeSetFeedbackStatus('Escreva entre 5 e 2000 caracteres.', 'error'); return; }
            const rating = ratingRaw ? Number(ratingRaw) : null;
            if (rating !== null && (!Number.isInteger(rating) || rating < 1 || rating > 5)) { eeSetFeedbackStatus('Escolha uma avaliação válida.', 'error'); return; }
            const lastSent = Number(localStorage.getItem(EE_FEEDBACK_COOLDOWN_KEY) || 0);
            if (lastSent && Date.now() - lastSent < 15000) { eeSetFeedbackStatus('Aguarde alguns segundos antes de enviar outro feedback.', 'warning'); return; }
            if (button) { button.disabled = true; button.textContent = 'Enviando…'; }
            eeSetFeedbackStatus('Enviando feedback…');
            try {
              const response = await fetch(`${EE_FEEDBACK_PROJECT_URL}/rest/v1/ee_feedback`, {
                method:'POST',
                headers:{ 'apikey':EE_FEEDBACK_PUBLIC_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
                body:JSON.stringify({ category, rating, message, page:String(location.hash || '#home').slice(0,200), app_version:48 })
              });
              if (!response.ok) {
                const detail = await response.text().catch(() => '');
                throw new Error(detail || `Erro HTTP ${response.status}`);
              }
              localStorage.setItem(EE_FEEDBACK_COOLDOWN_KEY, String(Date.now()));
              form?.reset();
              eeUpdateFeedbackCounter();
              eeSetFeedbackStatus('Obrigado! Seu feedback foi enviado.', 'success');
              if (typeof showToast === 'function') showToast('Feedback enviado. Obrigado!');
              setTimeout(() => $('#feedbackDialog')?.close(), 900);
            } catch (error) {
              console.error('Falha ao enviar feedback:', error);
              eeSetFeedbackStatus(navigator.onLine === false ? 'Você está offline. Conecte-se à internet e tente novamente.' : 'Não foi possível enviar agora. Tente novamente em instantes.', 'error');
            } finally {
              if (button) { button.disabled = false; button.textContent = 'Enviar feedback'; }
            }
          }
          function initFeedbackFeature() {
            $('#openFeedback')?.addEventListener('click', openFeedbackDialog);
            $('#closeFeedback')?.addEventListener('click', () => $('#feedbackDialog')?.close());
            $('#cancelFeedback')?.addEventListener('click', () => $('#feedbackDialog')?.close());
            $('#feedbackText')?.addEventListener('input', eeUpdateFeedbackCounter);
            $('#feedbackForm')?.addEventListener('submit', eeSubmitFeedback);
            $('#feedbackDialog')?.addEventListener('click', event => { if (event.target === $('#feedbackDialog')) $('#feedbackDialog').close(); });
          }

          '''
          init_marker = 'function initPlatformFeatures() {'
          if init_marker not in platform:
              raise SystemExit('platform init marker not found')
          platform = platform.replace(init_marker, feedback_js + init_marker, 1)
          platform = platform.replace('  initCloudSyncFeature();\n', '  initCloudSyncFeature();\n  initFeedbackFeature();\n', 1)

          feedback_css = r'''

          /* Feedback integration v48 — public Supabase inbox */
          .footer-link-button {
            display:block; width:fit-content; padding:6px 0; border:0; background:transparent;
            color:var(--text-2); font-size:14px; cursor:pointer; text-align:left;
          }
          .footer-link-button:hover { color:var(--text); }
          .feedback-modal { width:min(680px,calc(100vw - 32px)); }
          .feedback-body { gap:16px; }
          .feedback-field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
          .feedback-body label:not(.feedback-honeypot) { display:grid; gap:7px; color:var(--text-2); font-size:12px; font-weight:700; }
          .feedback-body select, .feedback-body textarea {
            width:100%; border:1px solid var(--border); border-radius:10px; background:var(--bg-2); color:var(--text); outline:0;
          }
          .feedback-body select { min-height:44px; padding:0 12px; }
          .feedback-body textarea { min-height:150px; padding:12px 13px; resize:vertical; line-height:1.55; }
          .feedback-body select:focus, .feedback-body textarea:focus { border-color:var(--border-strong); box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 12%,transparent); }
          .feedback-message-field small { justify-self:end; color:var(--text-4); font-weight:600; }
          .feedback-honeypot { position:fixed !important; left:-10000px !important; width:1px !important; height:1px !important; overflow:hidden !important; opacity:0 !important; pointer-events:none !important; }
          .feedback-actions { grid-template-columns:1fr 1fr auto auto; }
          html[data-theme="light"] .feedback-body select, html[data-theme="light"] .feedback-body textarea { background:#fffdf9; border-color:#d4c9bc; }
          @media (max-width:600px) {
            .feedback-field-grid { grid-template-columns:1fr; }
            .feedback-actions { grid-template-columns:1fr 1fr; }
            .feedback-actions > span { display:none; }
          }
          '''
          styles = styles.rstrip() + feedback_css + '\n'

          schema = '''-- Enterprise Educacional — banco dedicado de feedbacks
          -- Use em um projeto Supabase separado do backend de sincronização de usuários.

          create table if not exists public.ee_feedback (
            id uuid primary key default gen_random_uuid(),
            category text not null default 'geral' check (category in ('geral','conteudo','playground','bug','visual','sugestao')),
            rating smallint check (rating between 1 and 5),
            message text not null check (char_length(trim(message)) between 5 and 2000),
            page text not null default '' check (char_length(page) <= 200),
            app_version integer not null default 48 check (app_version between 1 and 9999),
            created_at timestamptz not null default now()
          );
          alter table public.ee_feedback enable row level security;
          revoke all on table public.ee_feedback from anon, authenticated;
          grant usage on schema public to anon, authenticated;
          grant insert (category, rating, message, page, app_version) on table public.ee_feedback to anon, authenticated;
          drop policy if exists ee_feedback_insert_public on public.ee_feedback;
          create policy ee_feedback_insert_public on public.ee_feedback for insert to anon, authenticated
          with check (
            category in ('geral','conteudo','playground','bug','visual','sugestao')
            and (rating is null or rating between 1 and 5)
            and char_length(trim(message)) between 5 and 2000
            and char_length(page) <= 200
            and app_version between 1 and 9999
          );
          create index if not exists ee_feedback_created_at_idx on public.ee_feedback (created_at desc);
          comment on table public.ee_feedback is 'Feedbacks anonimos enviados pelo site Enterprise Educacional.';
          '''
          (root / 'supabase' / 'feedback-schema.sql').write_text(schema, encoding='utf-8')

          validate = validate.replace('.filter(version => version < 47)', '.filter(version => version < 48)', 1)
          validate = validate.replace("if (css.lastIndexOf('Quality consolidation v47') < css.lastIndexOf('Product polish v46')) fail('Camada final de CSS v47 não é a autoridade mais recente');\nelse ok('Autoridade CSS v47 consolidada');", "if (css.lastIndexOf('Quality consolidation v47') < css.lastIndexOf('Product polish v46')) fail('Camada final de CSS v47 não preservada');\nelse if (css.lastIndexOf('Feedback integration v48') < css.lastIndexOf('Quality consolidation v47')) fail('Camada final de CSS v48 não é a autoridade mais recente');\nelse ok('Autoridade CSS v48 consolidada');", 1)
          validate = validate.replace("/appVersion\\s*:\\s*47/", "/appVersion\\s*:\\s*48/", 1)
          validate = validate.replace('Versão de backup não atualizada para v47', 'Versão de backup não atualizada para v48', 1)
          feedback_checks = '''\nconst feedbackSchemaPath = path.join(root,'supabase/feedback-schema.sql');\nconst feedbackSchemaSource = fs.existsSync(feedbackSchemaPath) ? read('supabase/feedback-schema.sql') : '';\nif (!html.includes('id="feedbackDialog"') || !html.includes('id="openFeedback"') || !html.includes('id="feedbackForm"')) fail('Interface de feedback ausente');\nelse ok('Interface de feedback presente');\nif (!platformSource.includes('EE_FEEDBACK_PROJECT_URL') || !platformSource.includes('sb_publishable_') || !platformSource.includes('/rest/v1/ee_feedback')) fail('Integração pública de feedback incompleta');\nelse if (/sb_secret_|service_role\\s*=|service_role['\"]\\s*:/i.test(platformSource)) fail('Credencial privilegiada encontrada na integração de feedback');\nelse ok('Integração de feedback usa apenas chave publicável');\nif (!feedbackSchemaSource.includes('enable row level security') || !feedbackSchemaSource.includes('grant insert') || !feedbackSchemaSource.includes('revoke all')) fail('Schema de feedback sem proteção RLS/grants mínimos');\nelse ok('Schema de feedback protegido por RLS e privilégio mínimo');\n'''
          validate = validate.replace('\nif (process.exitCode) process.exit(process.exitCode);', feedback_checks + '\nif (process.exitCode) process.exit(process.exitCode);', 1)

          index_path.write_text(index, encoding='utf-8')
          platform_path.write_text(platform, encoding='utf-8')
          styles_path.write_text(styles, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          build_path.write_text(build, encoding='utf-8')
          validate_path.write_text(validate, encoding='utf-8')
          PY
      - name: Validar código e estrutura
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          node scripts/validate.mjs
      - name: Gerar standalone
        run: |
          python scripts/build-standalone.py
          python - <<'PY'
          from pathlib import Path
          standalone = Path('Enterprise-Educacional.html').read_text(encoding='utf-8')
          assert 'data-build="48"' in standalone
          assert 'id="feedbackDialog"' in standalone
          assert 'sb_publishable_' in standalone
          assert 'src="platform-features.js' not in standalone
          assert 'href="styles.css' not in standalone
          print('OK: standalone v48 com feedback integrado')
          PY
      - name: Commitar v48
        run: |
          git rm .github/workflows/apply-feedback-v48.yml
          git config user.name "Sung_Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: adiciona feedbacks com banco Supabase dedicado"
          git push origin HEAD:main
