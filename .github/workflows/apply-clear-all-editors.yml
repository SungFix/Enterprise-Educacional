name: Aplicar limpar tudo no Playground

on:
  push:
    paths:
      - '.github/trigger-clear-all-editors.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Atualizar Playground
        shell: bash
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Gerar e validar
        shell: bash
        run: |
          node --check app.js
          node --check platform-features.js
          node --check bootstrap.js
          node --check service-worker.js
          python scripts/build-standalone.py
          node scripts/validate.mjs
          python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Commit final
        shell: bash
        run: |
          git config user.name 'Sung_Fix'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-clear-all-editors.yml .github/trigger-clear-all-editors.txt
          git add -A
          git commit -m 'feat: adiciona limpar todos os editores do Playground'
          git push origin main
